<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Painel do Gestor — <span id="nomeGestor"></span></h1>

        document.getElementById('nomeGestor').textContent = nome
    </script>
